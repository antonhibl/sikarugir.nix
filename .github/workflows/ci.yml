name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-05-15
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: Build satisfactory-example
        run: nix build --print-build-logs .#satisfactory-example

      - name: Build + run dedup-check
        run: nix build --print-build-logs .#dedup-check

      - name: Evaluate the module/flake-parts outputs (catches syntax errors nothing else forces)
        run: |
          set -euxo pipefail
          nix eval --raw --impure --expr '
            let flake = builtins.getFlake (toString ./.); in
            builtins.seq flake.homeManagerModules.default
            builtins.seq flake.darwinModules.default
            builtins.seq flake.flakeModules.default
            "modules evaluate OK"
          '

      - name: Create the example instance
        run: |
          set -euxo pipefail
          DEST="$RUNNER_TEMP/SikarugirInstances"
          nix build .#satisfactory-example
          ACTIVATION_SCRIPT="$(nix build --no-link --print-out-paths --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = builtins.currentSystem; };
              versions = flake.lib.versions;
              opts = flake.lib.mkOptions { inherit (pkgs) lib; };
              cfg = (pkgs.lib.evalModules {
                modules = [ { options = opts; } (import ./examples/satisfactory.nix) ];
              }).config;
              inst = (flake.lib.mkInstance { inherit pkgs; inherit (pkgs) lib; }) cfg;
            in inst.activationScript
          ')"
          echo "$ACTIVATION_SCRIPT/bin/sikarugir-activate-SatisfactoryCX" > /tmp/activate-script-path
          "$(cat /tmp/activate-script-path)" "$DEST"
          echo "APP=$DEST/SatisfactoryCX.app" >> "$GITHUB_ENV"

      - name: Verify the new .app is a real directory, not a symlink
        run: |
          set -euxo pipefail
          if [ -L "$APP" ]; then
            echo "FAIL: $APP is itself a symlink! it should be a real," >&2
            echo "physically-copied directory (see the activation script's cp -a step)." >&2
            exit 1
          fi
          echo "OK: $APP is a real directory"

      - name: Verify Frameworks/Resources are shared and MacOS/Configure.app are real
        run: |
          for d in Resources Frameworks SharedSupport/wine; do
            if [ ! -L "$APP/Contents/$d" ]; then
              echo "FAIL: Contents/$d is NOT a symlink! spaceOptimized dedup isn't happening" >&2
              exit 1
            fi
          done
          for d in MacOS Configure.app SharedSupport/Logs; do
            if [ -L "$APP/Contents/$d" ] || [ ! -d "$APP/Contents/$d" ]; then
              echo "FAIL: Contents/$d must be a real per-instance directory" >&2
              exit 1
            fi
          done
          echo "OK: Frameworks/Resources/wine shared; MacOS, Configure.app, Logs per-instance"

      - name: Check Gatekeeper assessment
        run: spctl --assess --type execute --verbose "$APP" || true

      - name: Confirm the Wine prefix actually got created
        run: |
          set -euxo pipefail
          test -d "$APP/Contents/SharedSupport/prefix/drive_c"
          echo "prefix created OK"

      - name: Re-activate
        run: |
          set -euxo pipefail
          "$(cat /tmp/activate-script-path)" "$RUNNER_TEMP/SikarugirInstances"
          /usr/libexec/PlistBuddy -c 'Print :"Program Name and Path"' "$APP/Contents/Info.plist"
